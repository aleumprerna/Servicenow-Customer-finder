[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-identity-auth"
version = "0.1.0"
description = "Reusable Microsoft OAuth, encrypted token storage, and optional FastAPI integration"
readme = "microsoft_identity/README.md"
requires-python = ">=3.10"
dependencies = [
    "msal>=1.31,<2",
    "cryptography>=43,<51",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.12,<1",
    "itsdangerous>=2.2,<3",
    "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
include = ["microsoft_identity*"]
